[package]
name = "remote-phone-pairing-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C ABI bridge for the shared OPAQUE pairing core"

[lib]
# Keep the Windows DLL for Electron; Android statically links the archive into JNI.
crate-type = ["cdylib", "staticlib"]

[dependencies]
remote-phone-pairing-core = { path = "../pairing-core" }
zeroize = "1.8.1"
